name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  # Manual runs get their own group so they can be used to confirm a flaky fix.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # No .nvmrc or Cloudflare Node pin in the repo; engines is >=18.
          node-version: lts/*
          cache: npm

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Export Chrome path
        run: |
          echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
          "${{ steps.chrome.outputs.chrome-path }}" --version

      - name: Install dependencies
        run: npm ci

      - name: Check blog
        run: npm run check:blog

      - name: Build
        run: npm run build:dist

      - name: Accessibility
        run: npm run check:a11y

      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            --root-dir ${{ github.workspace }}/dist
            dist
          fail: true
