name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # No .nvmrc or Cloudflare Node pin in the repo; engines is >=18.
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check blog
        run: npm run check:blog

      - name: Build
        run: npm run build:dist

      - name: Accessibility
        run: npm run check:a11y

      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            --root-dir ${{ github.workspace }}/dist
            dist
          fail: true
