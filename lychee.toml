# Offline check of the published site in dist/.
# External http(s) and mailto links are not requested, so the job stays
# deterministic and does not depend on the network.
offline = true
no_progress = true

# Directory links such as /blog/ and ../ resolve to index.html.
index_files = ["index.html"]
fallback_extensions = ["html"]

# apps/plain/index.html is copied to both the sine home page and /boring/.
# The hidden "click here" link (href="boring/") is only valid on the home
# page; on the plain page it would resolve to /boring/boring/, which does
# not exist. Exclude that false positive.
exclude = ['/dist/boring/boring/?$']

# Downloadable .txt files (build logs, corpora) are data, not pages.
# Lychee reads path-like strings inside them as links and fails on
# stack-trace frames such as scripts/check-blog.js:107:13.
exclude_path = ['\.txt$']
