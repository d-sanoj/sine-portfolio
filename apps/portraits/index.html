<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portrait tracer</title>
<style>
  :root { --bg: #131313; --ink: #ebe8e1; --muted: #97948d; --line: #2b2b29; --accent: #c9dcee; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, "Segoe UI", sans-serif; }
  header { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; }
  h1 { font-size: 16px; margin: 0; letter-spacing: 0.04em; }
  .hint { color: var(--muted); font-size: 12px; }
  label { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
  input[type=number] { width: 70px; background: #1d1d1d; color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; font: inherit; }
  button { font: inherit; color: var(--ink); background: #242424; border: 1px solid #3a3a38; border-radius: 4px; padding: 5px 12px; cursor: pointer; }
  button:hover { background: #2e2e2e; }
  button:disabled { opacity: 0.4; cursor: default; }
  .spacer { flex: 1; }
  #status { color: var(--muted); font-size: 12px; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(560px, 1fr)); gap: 14px; padding: 16px 20px 40px; }
  .card { border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
  .card .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .card .row > div { aspect-ratio: 16 / 9; background: #181818; border-radius: 3px; overflow: hidden; }
  .card img, .card canvas { width: 100%; height: 100%; display: block; object-fit: contain; }
  .card .meta { margin-top: 6px; display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12px; }
  .card .cap { color: var(--muted); font-size: 11px; display: flex; justify-content: space-between; }
</style>
</head>
<body>
<header>
  <h1>PORTRAIT TRACER</h1>
  <span class="hint">photo &rarr; line art &rarr; one sine curve (what the loader draws)</span>
  <span class="spacer"></span>
  <label>Ink darker than <input type="number" id="ink" value="105" min="20" max="200"></label>
  <label>Thick shape &ge; <input type="number" id="thick" value="15" min="3" max="30"> px</label>
  <label>Sine terms <input type="number" id="keep" value="2200" min="100" max="4000" step="100"></label>
  <button id="run">Trace all</button>
  <button id="save" disabled>Save portraits</button>
  <span id="status"></span>
</header>
<main id="gallery"></main>
<script type="module" src="app/main.js"></script>
</body>
</html>
