<meta charset="utf-8">

<title>Sanoj · AI Engineer</title>
<link rel="icon" href="assets/favicon.svg?v=2" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png?v=2" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=2">
<meta name="description" content="Sanoj is an AI engineer building retrieval, local AI, text processing and analytics systems that turn messy inputs into useful outputs.">
<style>
  /* the few bits of real text (see app/view/RealTextView.js) use the same font as the sine letters were drawn from */
  @font-face { font-family: 'Josefin Sans'; src: url('assets/fonts/JosefinSans-VF.ttf') format('truetype'); font-weight: 100 700; font-display: block; }
  .sine-real-link { color: inherit; }
  .sine-real-link:focus-visible { outline: 2px solid #c9dcee; outline-offset: 3px; border-radius: 2px; }
  .sine-real-link:hover span { color: #c9dcee !important; }
  /* the portrait loader covers the page until it is ready (src/widgets/loader) */
  #sine-loader { position: fixed; inset: 0; z-index: 2147483647; background: #131313; }
  html, body { margin: 0; height: 100%; }
  /* The window is the one thing that scrolls (the page's code reads the window's scroll position). overflow-x is hidden on the
     root, not on body: put on body, some browsers (Safari) can make body the thing that scrolls, and then the letters below the
     first screen are never drawn and the real text stays put while the page moves. */
  html { overflow-x: hidden; }
  body { background: #131313; position: relative; }
  canvas { display: block; width: 100%; height: 100vh; }
</style>
<noscript><style>#sine-loader { display: none; }</style></noscript>
</head>
<body>
<div id="sine-loader" aria-hidden="true"></div>
<canvas id="c"></canvas>
<noscript><p style="color:#ebe8e1;font:20px sans-serif;padding:2rem"><a style="color:inherit" href="boring/">Open the plain version</a></p></noscript>
<!-- the code imports its parts as /core/... and /widgets/...; this makes those addresses relative to this page, so the site works
     wherever it is published (the root of a domain, or a folder like github.io/sine.portfolio/) -->
<script type="importmap">{"imports":{"/core/":"./core/","/widgets/":"./widgets/"}}</script>
<script type="module" src="app/main.js"></script>
</body>
</html>
